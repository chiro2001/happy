[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "~2.9", features = ["devtools"] }
# The log plugin is our only view into a release build: a Windows GUI binary has
# no console attached, so without a file sink anything the app logs is lost the
# moment it is written. The JS half of the app forwards its console output here
# (see utils/consoleLogging.ts) and this writes it to the OS log directory.
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
# Voice: the browser WebSocket constructor cannot set request headers, and
# DashScope authenticates with `Authorization: Bearer`. Opening the socket in
# Rust is what lets the desktop build talk to it directly, with no proxy and
# without the API key ending up in a URL.
tauri-plugin-websocket = "2"
